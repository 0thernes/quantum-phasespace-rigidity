# SPDX-License-Identifier: Apache-2.0
name = "QPRigidity"
version = "2.0.0"
defaultTargets = ["QPRigidity", "Challenge", "Solution", "PalomarSolution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true
linter.deprecated = true

[[lean_lib]]
name = "QPRigidity"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "Challenge"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "Solution"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "PalomarChallenge"

[[lean_lib]]
name = "PalomarSolution"
leanOptions = { warningAsError = true }

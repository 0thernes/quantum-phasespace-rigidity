# SPDX-License-Identifier: Apache-2.0
# Advisory mechanical preflight calling Palomar Registry's official reusable verifier workflow.
# Manual workflow_dispatch only; never blocks commits or pushes (Build Standard R1, R3).
name: Palomar Mechanical Preflight

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Exactly 12 lowercase alphanumeric characters"
        required: false
        default: "qprpreflight"
        type: string

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@952cc3697b3f335c6cc0c21932e55ee92921dd35
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 952cc3697b3f335c6cc0c21932e55ee92921dd35
      request_id: ${{ inputs.request_id || 'qprpreflight' }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"lean","comparator_config_path":"lean/comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'

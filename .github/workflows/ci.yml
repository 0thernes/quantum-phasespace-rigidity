# SPDX-License-Identifier: Apache-2.0
name: CI — 6-Kernel Lean 4 + Unified 7-Engine Polyglot + Security + AMS-LaTeX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-6kernel:
    name: Lean 4.35.0 (6 Independent Proof Kernels + Whole-Module Axiom Sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bubblewrap for paranoid kernel sandboxing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap

      - name: Install elan + Lean 4.35.0
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean 4.35.0 suite & PalomarChallenge
        working-directory: lean
        run: |
          lake build
          lake build PalomarChallenge
          lake env leanchecker --fresh PalomarSolution
          lake env leanchecker-paranoid --fresh PalomarSolution

      - name: Replay all 14 Palomar targets across all 6 independent proof kernels
        working-directory: lean
        run: |
          lake check --paranoid
          lake comparator --config comparator.json --paranoid

      - name: Verify #print axioms & whole-module Lean.collectAxioms sweep
        working-directory: lean
        run: |
          lake env lean VerifyAxioms.lean > /tmp/ci_axioms.txt
          cat /tmp/ci_axioms.txt
          diff -u ../results/lean_axioms.txt /tmp/ci_axioms.txt
          lake env lean SweepAllAxioms.lean

      - name: Negative Axiom Test (ensure unauthorized axiom is caught)
        working-directory: lean
        run: |
          cat <<'EOF' > /tmp/NegAxiomTest.lean
          import PalomarSolution
          axiom forbidden_fake_axiom : True
          theorem tainted : True := forbidden_fake_axiom
          #print axioms tainted
          EOF
          OUT=$(lake env lean /tmp/NegAxiomTest.lean)
          echo "$OUT"
          echo "$OUT" | grep -q "forbidden_fake_axiom"

      - name: Check README verbatim axiom lock & zero forbidden legacy affiliation
        run: python3 scripts/check_readme_axioms.py

  rust-matrix:
    name: Rust 1.94 (#![forbid(unsafe_code)]) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (-D warnings), release tests, and exact verification
        working-directory: rust
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --release
          cargo run --release -- --verify-all
      - name: Upload Ubuntu Rust binary for unified differential verification
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: bin-rust-linux
          path: rust/target/release/qpr-rust

  zig-matrix:
    name: Zig comptime + exhaustive F_8/F_7 engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - name: Test & verify Zig engine
        working-directory: zig
        run: |
          zig version
          zig test src/main.zig
          mkdir -p zig-out
          zig build-exe -OReleaseSafe -target x86_64-linux-musl -mcpu=x86_64 src/main.zig -femit-bin=zig-out/qpr_zig
          ./zig-out/qpr_zig --verify-all
      - name: Upload Ubuntu Zig binary for unified differential verification
        uses: actions/upload-artifact@v7
        with:
          name: bin-zig-linux
          path: zig/zig-out/qpr_zig

  cpp-c-asm-sanitizers:
    name: C++20 Z[zeta_p] + ISO C11 + x86-64 NASM + Moonlab + ASan/UBSan + 100k Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build & verify C++20 cyclotomic engine (with ASan/UBSan)
        working-directory: cpp
        run: |
          mkdir -p build
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -o build/qpr_cpp src/qpr_cyclotomic.cpp
          ./build/qpr_cpp --verify-all
      - name: Build & verify C11 + NASM ELF64 + Moonlab + QGTL + QRNG + 100k Fuzzer
        working-directory: c
        run: |
          mkdir -p build
          nasm -f elf64 -o build/pauli_popcnt.o ../asm/pauli_popcnt.asm
          for pair in "sha3.o:third_party/moonlab/crypto/sha3/sha3.c" \
                      "aes.o:third_party/moonlab/crypto/aes/aes.c" \
                      "ctr_drbg.o:third_party/moonlab/crypto/drbg/ctr_drbg.c" \
                      "health_tests.o:third_party/moonlab/applications/health_tests.c"; do
            obj="${pair%%:*}"; src="${pair#*:}"
            gcc -std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -Ithird_party/moonlab -Ithird_party/moonlab/applications -c -o "build/$obj" "$src"
          done
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude \
            -o build/qpr_c src/main.c src/qpr_core.c src/qgtl_metric.c src/qrng_fw.c \
            build/sha3.o build/aes.o build/ctr_drbg.o build/health_tests.o build/pauli_popcnt.o -lm
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iinclude \
            -o build/fuzz_qpr tests/fuzz_qpr.c build/pauli_popcnt.o
          ./build/qpr_c --verify-all
          ./build/fuzz_qpr 100000
      - name: Upload Ubuntu C++20 & C11+NASM binaries for unified differential verification
        uses: actions/upload-artifact@v7
        with:
          name: bin-cpp-c-linux
          path: |
            cpp/build/qpr_cpp
            c/build/qpr_c

  unified-7engine-differential:
    name: Unified 7-Engine Differential (REQUIRE_ALL_ENGINES=1) + 12/12 Mutation + Schema
    runs-on: ubuntu-latest
    needs: [rust-matrix, zig-matrix, cpp-c-asm-sanitizers]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download all compiled native engine binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-rust-linux
          path: rust/target/release
      - uses: actions/download-artifact@v5
        with:
          name: bin-zig-linux
          path: zig/zig-out
      - uses: actions/download-artifact@v5
        with:
          name: bin-cpp-c-linux
          path: .
      - name: Ensure executable permissions on downloaded binaries
        run: |
          chmod +x rust/target/release/qpr-rust zig/zig-out/qpr_zig cpp/build/qpr_cpp c/build/qpr_c
      - name: Install Python dev & schema dependencies
        run: pip install -e ".[dev]"
      - name: Run Eshkol AD, quickstart, REQUIRE_ALL_ENGINES=1 pytest, 12/12 mutation, ruff, mypy
        run: |
          python eshkol/run_eshkol_ad.py --verify-all
          PYTHONPATH=src:. python examples/quickstart_demo.py
          REQUIRE_ALL_ENGINES=1 PYTHONPATH=src:. pytest -v tests/test_all.py
          PYTHONPATH=src:. python scripts/mutate.py
          ruff check src tests scripts reference examples eshkol
          mypy src reference

  security-supply-chain:
    name: Secret Scan (gitleaks) + Vulnerability Audit (osv-scanner) + Timestamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run gitleaks secret scan across full git history
        run: |
          GITLEAKS_VER="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --verbose --no-banner
      - name: Run OSV-Scanner dependency vulnerability audit
        run: |
          OSV_VER="2.0.1"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -L requirements.lock.txt -L rust/Cargo.lock
      - name: Verify RFC 3161 (OpenSSL) & Bitcoin OpenTimestamps cryptographic anchors
        run: python3 scripts/stamp_timestamps.py --verify

  latex-and-provenance:
    name: AMS-LaTeX Tectonic + Clean-Room arXiv + Build Standard v1.2.0 + 1000-Check Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Compile AMS-LaTeX + Clean-Room arXiv Tarball & Zero-Overfull Audit
        run: python scripts/build_arxiv_bundle.py --check-only
      - name: Run Build Standard v1.2.0 Audit, Zero-Padding 1,000-Check Audit, & Blueprint
        run: |
          python scripts/build_blueprint.py
          python scripts/hardening_audit.py
          bash scripts/audit-repo.sh
      - name: Upload Frozen PDF & arXiv Tarball
        uses: actions/upload-artifact@v7
        with:
          name: white-paper-and-arxiv-bundle
          path: |
            dist/Donahue_2026_quantum_phasespace_rigidity.pdf
            dist/arxiv_submission.tar.gz

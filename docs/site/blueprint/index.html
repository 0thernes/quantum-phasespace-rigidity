<style>

requency t-RQLS."}, {"id": "T2b", "decl": "QPRigidity.Palomar.prove_t2b", "pillar": "Pillar II (RQLS)", "file": "lean/QPRigidity/ResolvableQLS.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T2a"], "summary": "Kernel-checked certificates for 2-RQLS(9), 3-RQLS(11), 4-RQLS(13), and char-2 3-RQLS(16) (0 off-diagonal collinear pairs)."}, {"id": "T2c", "decl": "QPRigidity.Palomar.prove_t2c", "pillar": "Pillar II (RQLS)", "file": "lean/QPRigidity/ResolvableQLS.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T2b"], "summary": "Universal direct-product lifting: BOTH untwisted Q_1 x Q_2 (3-RQLS(143)) and unitary-twisted Q_1 x_D C_2 (3-RQLS(55) with twistSep witness)."}, {"id": "T2d", "decl": "QPRigidity.Palomar.prove_t2d", "pillar": "Pillar II (RQLS)", "file": "lean/QPRigidity/ResolvableQLS.lean", "axioms": ["propext", "Quot.sound"], "deps": [], "summary": "Zero-gap F_8 obstruction: every orthomorphism fixing 0 is F_2-linear (0/4,872 nonlinear permutations)."}, {"id": "T3a", "decl": "QPRigidity.Palomar.prove_t3a", "pillar": "Pillar III (Magic)", "file": "lean/QPRigidity/MagicGeometry.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": [], "summary": "Gurvits-Barnum Cor. 3 exact identity (ASTAB subset AWP subseteq ASEP odd p) & 2-qubit rational witnesses rho_ent, rho_sep."}, {"id": "T3b", "decl": "QPRigidity.Palomar.prove_t3b", "pillar": "Pillar III (Magic)", "file": "lean/QPRigidity/MagicGeometry.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T3a"], "summary": "Universal global polytope optimality in Z[sqrt(3)] & Z[sqrt(5)] for R^2(ASTAB_{2,2}) = 3(13+4*sqrt(3))/484 and R^2(ASTAB_{1,3}) = (7-3*sqrt(5))/6."}, {"id": "T3c", "decl": "QPRigidity.Palomar.prove_t3c", "pillar": "Pillar III (Magic)", "file": "lean/QPRigidity/MagicGeometry.lean", "axioms": ["propext", "Quot.sound"], "deps": [], "summary": "General finite uniform-covering double-counting theorem + Symplectic Marginal Descent (C_n <= (7*4^n + 8)/(15*2^n), exact 15/7x inball gain)."}, {"id": "T3d", "decl": "QPRigidity.Palomar.prove_t3d", "pillar": "Pillar III (Magic)", "file": "lean/QPRigidity/MagicGeometry.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": [], "summary": "First-principles multivariate polynomial Clifford-Reynolds Degree-2 RLT+SOS Barrier: M >= 4^n - 1 for ALL n >= 1."}, {"id": "ALL", "decl": "QPRigidity.Palomar.prove_all_rigidity_theorems", "pillar": "Master Bundle", "file": "lean/PalomarSolution.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T1e", "T2c", "T2d", "T3b", "T3c", "T3d"], "summary": "Unified Palomar Challenge-Solution master conjunction across all 13 pillar theorems."}, {"id": "NV1", "decl": "QPRigidity.NonVacuity.nonvacuity_pillar1_ame", "pillar": "Non-Vacuity", "file": "lean/QPRigidity/NonVacuity.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T1b", "T1c"], "summary": "Concrete Prism_6 AME(6,12), W_5 AME(6,12), C_5 AME(5,6), and inhabited Pless specs."}, {"id": "NV2", "decl": "QPRigidity.NonVacuity.nonvacuity_pillar2_rqls_lifts", "pillar": "Non-Vacuity", "file": "lean/QPRigidity/NonVacuity.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T2b", "T2c"], "summary": "Concrete inhabited 3-RQLS(143) (untwisted 11 x 13) AND 3-RQLS(55) (twisted 11 x_D 5)."}, {"id": "NV3", "decl": "QPRigidity.NonVacuity.nonvacuity_pillar3_magic", "pillar": "Non-Vacuity", "file": "lean/QPRigidity/NonVacuity.lean", "axioms": ["propext", "Classical.choice", "Quot.sound"], "deps": ["T3a", "T3b", "T3c", "T3d"], "summary": "Inhabited witnesses for Gurvits-Barnum D=9, both global ASTAB theorems, SMD n=3, and pointwise polynomial RLT barrier (n=1, K=6, M=3)."}, {"id": "ADV", "decl": "QPRigidity.AdversarialTests (6 refutations)", "pillar": "Adversarial", "file": "lean/QPRigidity/AdversarialTests.lean", "axioms": ["propext", "Quot.sound", "Classical.choice"], "deps": ["T1b", "T1c", "T2d", "T3b", "T3d"], "summary": "6 concrete boundary refutations (Path_5, N=8/13 Pless, F_8 swap67, pointwise Deg-2 RLT M=14, 2q ASTAB outside GB ball)."}];
const POS = {
  T1a:[75,55], T1b:[75,125], T1c:[75,195], T1d:[75,265], T1e:[250,155],
  T2a:[435,70], T2b:[435,160], T2c:[600,120], T2d:[600,225],
  T3a:[775,60], T3b:[940,60], T3c:[775,165], T3d:[775,265],
  ALL:[980,175], NV1:[250,295], NV2:[600,315], NV3:[940,295], ADV:[435,295]
};
const COLORS = {
  "Pillar I (AME)":"#0284c7", "Pillar II (RQLS)":"#059669", "Pillar III (Magic)":"#d97706",
  "Master Bundle":"#7c3aed", "Non-Vacuity":"#0f766e", "Adversarial":"#be123c"
};
function drawDAG() {
  const svg = document.getElementById("dag");
  let out = '<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#475569"/></marker></defs>';
  for (const n of NODES) {
    const [x2, y2] = POS[n.id];
    for (const d of n.deps) {
      const [x1, y1] = POS[d];
      out += `<line x1="${x1+44}" y1="${y1}" x2="${x2-44}" y2="${y2}" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>`;
    }
  }
  for (const n of NODES) {
    const [x, y] = POS[n.id];
    const col = COLORS[n.pillar] || "#334155";
    out += `<g style="cursor:pointer" onclick="document.getElementById('q').value='${n.id}';render();">
      <rect x="${x-44}" y="${y-20}" width="88" height="40" rx="8" fill="${col}" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700" font-family="ui-monospace,monospace">${n.id}</text>
    </g>`;
  }
  svg.innerHTML = out;
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const p = document.getElementById("pillar").value;
  const list = NODES.filter(n => (!p || n.pillar === p) && (!q || JSON.stringify(n).toLowerCase().includes(q)));
  document.getElementById("cards").innerHTML = list.map(n => `
    <article class="card">
      <div><span class="pill">${n.pillar}</span><span class="pill ok">KERNEL-VERIFIED</span></div>
      <div class="decl">${n.id} &mdash; ${n.decl}</div>
      <p style="margin:0.4rem 0;font-size:0.88rem;color:#cbd5e1;">${n.summary}</p>
      <div class="meta">File: <code>${n.file}</code><br>Axioms: <code>[${n.axioms.join(", ")}]</code>${n.deps.length ? "<br>Depends on: " + n.deps.join(", ") : ""}</div>
    </article>`).join("");
}
drawDAG(); render();
document.getElementById("q").addEventListener("input", render);
document.getElementById("pillar").addEventListener("change", render);
</script>

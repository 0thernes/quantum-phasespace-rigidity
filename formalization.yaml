status:
  scope: >-
    All 13 headline theorems (T1a-T3d), master conjunction (14 Palomar Comparator
    targets), 3 NonVacuity witnesses, and 6 AdversarialTests boundary refutations
    are kernel-checked in zero-Mathlib Lean 4.35.0 with zero sorry outside
    statement-only PalomarChallenge.lean and zero unauthorized axioms across all
    311 project declarations. Explicitly does NOT resolve non-stabilizer even-d
    AME(N,d), Zhang-Cao's 17 sporadic 1-RQLS orders (starting at v = 10),
    Zurel-Davis Conjectures 1-2 for n >= 3, or odd-prime multipartite
    bound-entangled AWP; retires 0/2,000 catalogued Mega-Atlas grand open problems.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "QPRigidity.Palomar.prove_all_rigidity_theorems"
      file: "lean/PalomarSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "lean/comparator.json"

fidelity:
  divergences: >-
    Every Lean declaration is audited line by line against paper/main.tex in
    docs/statement-fidelity.md, CLAIMS.md, and LIMITATIONS.md. Analytic
    Hilbert-space bridges (Helwig 2013 graph-state equivalence, cyclic
    Weyl-Heisenberg subgroup reduction, complex root-of-unity orthogonality
    verified without floats over 198,820 Z[zeta_p] pairs in C++20, generic phase
    twist D_phi discharging twistSep for Q_1 x_D C_2, Gurvits-Barnum Cor. 3,
    Verstraete et al. ASEP criterion, and Sp(2n,2) transitivity / C_2 = 2 /
    Lambda_2 overlap >= -1 verified exhaustively in Rust) are proved in
    paper/main.tex outside Lean.


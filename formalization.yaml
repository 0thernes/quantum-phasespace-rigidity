project:
  name: "Discrete Symplectic Phase-Space Rigidity: Cyclic Stabilizer AME Dichotomy, Maximal-Cardinality Resolvable Quantum Latin Squares, and Stabilizer-Polytope Magic Geometry"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization (warningAsError = true; 12 module files,
    11 sorry-free plus statement-only PalomarChallenge.lean; 23 explicit audited
    declarations and 311 project declarations exhaustively axiom-swept via
    SweepAllAxioms.lean strictly within [propext, Classical.choice, Quot.sound])
    certifying 13 headline theorems (T1a-T3d) across three linked pillars of discrete
    symplectic quantum phase-space geometry: (I) radical-CRT k-uniform graph lifts,
    all-d unimodular AME graph lifts (K_2, K_3, C_5, Prism_6, and 20-case W_5 for
    all d >= 2), pure-integer Pless bounds, binary commuting-weight additivity and
    Rains shadow contradictions at N in {4,7,9,11}, torsion Singleton rank forcing,
    additive F_4-MDS obstructions (A_6 = -21 at N = 7 and odd N >= 9), and explicit
    Z_4-versus-F_4 separation at (4,4); (II) abstract trace-spanning maximal-cardinality
    resolvable quantum Latin square theorem, explicit certificates for 2-RQLS(9),
    3-RQLS(11), 4-RQLS(13), and characteristic-2 3-RQLS(16), both untwisted Q_1 x Q_2
    and twist-separated Q_1 x_D C_2 direct-product lifting, and exhaustive proof that
    every orthomorphism of F_8 fixing 0 is F_2-linear; and (III) Gurvits-Barnum purity
    identity and rational 2-qubit ASTAB/ASEP incomparability witnesses, universal global
    polytope circumradius bounds in Z[sqrt(3)] for ASTAB_{2,2} and Z[sqrt(5)] for
    ASTAB_{1,3}, finite uniform-cover Symplectic Marginal Descent yielding an exact
    15/7 squared-inball gain for all n >= 2, and a first-principles multivariate
    polynomial degree-2 RLT+SOS barrier M >= 4^n - 1. Analytic Hilbert-space bridges
    are proved outside Lean in paper/main.tex and audited line by line in
    docs/statement-fidelity.md.
  authors:
    - "Alexander Stephen Donahue"
  responsible_maintainers:
    - "Alexander Stephen Donahue"
  license: "Apache-2.0"

